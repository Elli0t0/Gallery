name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-24.04
    outputs:
      version_name: ${{ steps.verify_apk.outputs.version_name }}
      version_code: ${{ steps.verify_apk.outputs.version_code }}
      cert_sha256: ${{ steps.verify_apk.outputs.cert_sha256 }}
      key_generated: ${{ steps.prepare_signing.outputs.key_generated }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing
        id: prepare_signing
        shell: bash
        env:
          GALLERY_KEYSTORE_BASE64: ${{ secrets.GALLERY_KEYSTORE_BASE64 }}
          GALLERY_KEYSTORE_PASSWORD: ${{ secrets.GALLERY_KEYSTORE_PASSWORD }}
          GALLERY_KEY_ALIAS: ${{ secrets.GALLERY_KEY_ALIAS }}
          GALLERY_KEY_PASSWORD: ${{ secrets.GALLERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$GALLERY_KEYSTORE_BASE64" ]; then
            printf '%s' "$GALLERY_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "GALLERY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "GALLERY_KEYSTORE_PASSWORD=$GALLERY_KEYSTORE_PASSWORD"
              echo "GALLERY_KEY_ALIAS=$GALLERY_KEY_ALIAS"
              echo "GALLERY_KEY_PASSWORD=$GALLERY_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "key_generated=false" >> "$GITHUB_OUTPUT"
            echo "Using release signing secrets."
          else
            echo "::warning::No GALLERY_* signing secrets found. Generating a one-time release key for this build and uploading it as a CI artifact (gallery-signing-keystore). Download that artifact and save it as GALLERY_KEYSTORE_BASE64 / GALLERY_KEYSTORE_PASSWORD / GALLERY_KEY_ALIAS / GALLERY_KEY_PASSWORD before the next release, so future APKs keep the same signature. Then delete the artifact."
            GEN_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias gallery \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$GEN_PASS" -keypass "$GEN_PASS" \
              -dname "CN=Gallery, OU=Gallery, O=Gallery, L=Unknown, ST=Unknown, C=US" > /dev/null 2>&1
            cp "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/gallery-release.jks"
            {
              echo "GALLERY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "GALLERY_KEYSTORE_PASSWORD=$GEN_PASS"
              echo "GALLERY_KEY_ALIAS=gallery"
              echo "GALLERY_KEY_PASSWORD=$GEN_PASS"
              echo "GALLERY_GENERATED_PASSWORD=$GEN_PASS"
            } >> "$GITHUB_ENV"
            echo "key_generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease

      - name: Verify release APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then echo "::error::Release APK not found"; exit 1; fi
          BADGING_RAW=$("$AAPT2" dump badging "$APK_FILE")
          APP_ID=$(printf '%s\n' "$BADGING_RAW" | grep "^package: " | sed -E "s/^package:[[:space:]]+name='([^']+)'.*/\1/")
          V_CODE=$(printf '%s\n' "$BADGING_RAW" | grep "^package: " | sed -E "s/.*versionCode='([^']+)'.*/\1/")
          V_NAME=$(printf '%s\n' "$BADGING_RAW" | grep "^package: " | sed -E "s/.*versionName='([^']+)'.*/\1/")
          if [ "$APP_ID" != "com.elli0t0.gallery" ]; then echo "::error::Application ID mismatch"; exit 1; fi
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK_FILE" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          if [ -z "$CERT_SHA256" ]; then echo "::error::APK signature verification failed"; exit 1; fi
          echo "version_name=$V_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$V_CODE" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-0.0.1
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload generated signing keystore (only when secrets were missing)
        if: steps.prepare_signing.outputs.key_generated == 'true'
        shell: bash
        env:
          GEN_PASS: ${{ env.GALLERY_GENERATED_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$GEN_PASS" > "$RUNNER_TEMP/gallery-keystore-password.txt"
          ls -l "$RUNNER_TEMP/gallery-release.jks" "$RUNNER_TEMP/gallery-keystore-password.txt"

      - name: Upload keystore artifact
        if: steps.prepare_signing.outputs.key_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gallery-signing-keystore
          path: |
            ${{ runner.temp }}/gallery-release.jks
            ${{ runner.temp }}/gallery-keystore-password.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Gallery-0.0.1
          path: downloaded-artifact
      - name: Create and Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          CERT_SHA256: ${{ needs.build.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "::notice::Release tag already exists, skipping publish."
            exit 0
          fi
          APK_SOURCE=$(find downloaded-artifact -name "*.apk" -type f | head -n 1)
          FINAL_APK="Gallery-${VERSION_NAME}.apk"
          cp "$APK_SOURCE" "$FINAL_APK"
          sha256sum "$FINAL_APK" > "${FINAL_APK}.sha256"
          sed -n "/^## \[${VERSION_NAME}\]/,/^## \[/p" CHANGELOG.md | head -n -1 > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "## [${VERSION_NAME}]" > release_notes.md
            echo "" >> release_notes.md
            echo "Release version ${VERSION_NAME} (build ${VERSION_CODE})" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "### Signing Certificate SHA-256" >> release_notes.md
          echo "\`${CERT_SHA256}\`" >> release_notes.md
          gh release create "$TAG" "$FINAL_APK" "${FINAL_APK}.sha256" \
            --title "Gallery ${VERSION_NAME} (${VERSION_CODE})" \
            --notes-file release_notes.md --prerelease
